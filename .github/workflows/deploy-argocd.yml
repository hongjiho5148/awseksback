name: Backend → EKS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────────────────

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:      ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:             ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Build & Push
        id: build-image  # 👈 추가됨: 다음 단계에서 이 단계의 결과물을 참조하기 위함
        env:
          ECR: ${{ secrets.ECR_BACKEND_URI }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR:$TAG -t $ECR:latest .
          docker push $ECR:$TAG
          docker push $ECR:latest
          
          # 👈 추가됨: 빌드된 이미지 주소를 'image'라는 변수로 출력함
          echo "image=$ECR:$TAG" >> $GITHUB_OUTPUT

      - name: Checkout Infra Repository
        uses: actions/checkout@v3
        with:
          repository: hongjiho5148/awseksinfra 
          token: ${{ secrets.ARGOCD_GIT_TOKEN }}   
          path: infra-repo 

      - name: Update Manifest
        run: |
          cd infra-repo
          # 위에서 설정한 'build-image' 단계의 'image' 출력을 가져와서 업데이트
          sed -i "s|image:.*|image: ${{ steps.build-image.outputs.image }}|g" manifests/back/backend.yaml

      - name: Commit and Push Changes
        run: |
          cd infra-repo
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add manifests/back/backend.yaml
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update backend image to ${{ github.sha }} [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi